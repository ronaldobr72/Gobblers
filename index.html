<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gobblet Gobblers Web</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>Gobblet Gobblers</h1>
        <div class="scoreboard">
          <div class="score-box player-one">
            <span>Player 1</span>
            <strong id="score-player1">0</strong>
          </div>
          <div class="score-box player-two">
            <span>Player 2</span>
            <strong id="score-player2">0</strong>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <aside class="reserve reserve-left" id="reserve-player1"></aside>

        <section class="board-wrap">
          <div id="board" class="board" aria-label="Gobblet board"></div>
        </section>

        <aside class="reserve reserve-right" id="reserve-player2"></aside>
      </main>

      <footer class="status-bar">
        <div id="turn-indicator">Player 1 turn</div>
        <button id="next-match-btn" class="next-match-btn" type="button" hidden>Next Match</button>
      </footer>
    </div>

    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>

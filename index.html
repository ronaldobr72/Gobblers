<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gobblet Gobblers Web</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1>Gobblet Gobblers</h1>
        <div class="scoreboard">
          <div class="score-box player-one">
            <span>Player 1</span>
            <strong id="score-player1">0</strong>
          </div>
          <div class="score-box player-two">
            <span>Player 2</span>
            <strong id="score-player2">0</strong>
          </div>
        </div>
      </header>

      <nav class="mode-bar" aria-label="Modo de jogo">
        <button class="mode-btn active" data-mode="pvp" type="button">2 Jogadores</button>
        <button class="mode-btn" data-mode="cpu-easy" type="button">CPU Fácil</button>
        <button class="mode-btn" data-mode="cpu-medium" type="button">CPU Médio</button>
        <button class="mode-btn" data-mode="cpu-hard" type="button">CPU Difícil</button>
        <button class="mode-btn" data-mode="cpu-challenge" type="button">Engine Challenge</button>
        <button class="mode-btn" data-mode="arcade" type="button">Arcade</button>
      </nav>

      <div id="engine-settings" class="engine-settings-bar" hidden>
        <label for="engine-depth">Engine Depth: <span id="depth-value">8</span></label>
        <input type="range" id="engine-depth" min="5" max="12" value="8" step="1" />
      </div>

      <main class="game-layout">
        <aside class="reserve reserve-left" id="reserve-player1"></aside>

        <section class="board-wrap">
          <div id="board" class="board" aria-label="Gobblet board"></div>
        </section>

        <aside class="reserve reserve-right" id="reserve-player2"></aside>
      </main>

      <footer class="status-bar">
        <div id="level-indicator" hidden></div>
        <div id="turn-indicator">Player 1 turn</div>
        <button id="next-match-btn" class="next-match-btn" type="button" hidden>Next Match</button>
      </footer>
    </div>

    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
